{% extends "base.html" %}

{% block content %}
<div class="container text-center mt-5">
    <h1 class="display-1">404</h1>
    <h2>Page Not Found</h2>
    <p class="lead">Sorry, the page you are looking for does not exist.</p>
    <hr class="my-4">
    <p>
        You can return to the homepage or contact support if you believe this is an error.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Go to Homepage</a>
</div>
{% endblock %}
